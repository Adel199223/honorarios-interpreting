[build-system]
requires = ["setuptools==82.0.1", "wheel==0.47.0"]
build-backend = "setuptools.build_meta"

[project]
name = "honorarios-interpreting"
version = "0.1.0"
description = "Local-first web app for Portuguese interpreting honorários PDF requests and Gmail draft payloads."
readme = "README.md"
requires-python = ">=3.11,<3.12"
dependencies = [
  "reportlab>=4.2.0",
  "pypdf>=5.0.0",
  "fastapi>=0.115.0",
  "uvicorn>=0.30.0",
  "jinja2>=3.1.0",
  "python-multipart>=0.0.9",
  "httpx>=0.27.0",
  "Pillow>=10.0.0",
  "openai>=1.40.0",
]

[project.optional-dependencies]
dev = ["pytest==9.0.2", "setuptools==82.0.1", "wheel==0.47.0"]

[tool.uv]
required-version = "==0.12.20"
# Preserve the observed fee-app runtime versions; upgrades are separate work.
constraint-dependencies = [
  "Jinja2==3.1.6", "MarkupSafe==3.0.3", "annotated-doc==0.0.4",
  "annotated-types==0.7.0", "anyio==4.13.0", "certifi==2026.4.22",
  "charset-normalizer==3.4.7", "click==8.3.3", "colorama==0.4.6",
  "distro==1.9.0", "fastapi==0.136.1", "h11==0.16.0",
  "httpcore==1.0.9", "httpx==0.28.1", "idna==3.13", "jiter==0.14.0",
  "openai==2.33.0", "pillow==12.2.0", "pydantic==2.13.3",
  "pydantic-core==2.46.3", "pypdf==6.10.2", "python-multipart==0.0.27",
  "reportlab==4.5.0", "sniffio==1.3.1", "starlette==1.0.0",
  "tqdm==4.67.3", "typing-inspection==0.4.2", "typing-extensions==4.15.0",
  "uvicorn==0.46.0",
]

[project.scripts]
honorarios-web = "honorarios_app.web:main"

[tool.setuptools]
packages = ["honorarios_app", "scripts"]

[tool.setuptools.package-data]
honorarios_app = ["templates/*.html", "pdf_templates/*.html", "static/*.css", "static/*.js"]
scripts = ["*.mjs"]

[tool.pytest.ini_options]
testpaths = ["tests"]
