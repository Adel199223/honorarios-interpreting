name: Python package

permissions:
  contents: read

on:
  push:
    branches: ["main"]
  pull_request:

jobs:
  test:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version-file: .python-version
      - uses: actions/setup-node@v6
        with:
          node-version-file: .node-version
      - name: Install pinned uv
        run: python -m pip install uv==0.12.20
      - name: Reconstruct locked environment
        shell: powershell
        run: ./scripts/setup_dev_env.ps1
      - name: Validate source, package and isolated adapter workflow
        shell: powershell
        run: ./scripts/validate_dev.ps1 -Full
